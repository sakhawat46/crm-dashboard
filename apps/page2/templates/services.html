
{% block content %}
<div class="container py-5 text-light bg-dark">
    <h2 class="text-center mb-4">Our Services</h2>
    <div class="row">
        {% for service in services %}
        <div class="col-md-4 mb-4">
            <div class="card bg-secondary text-white h-100 text-center p-4">
                <i class="{{ service.icon }} fa-2x mb-3"></i>
                <h5>{{ service.title }}</h5>
                <p>{{ service.description }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
